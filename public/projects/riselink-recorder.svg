<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RiseLink Recorder Platform</title>
  <desc id="desc">An Android recorder application connected to an asynchronous cloud transcription backend.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#d8e8ff"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1830"/><stop offset="1" stop-color="#173d6f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#2b67b7" flood-opacity=".22"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#3f7fcf" opacity=".15"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/><rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(126 92)" filter="url(#shadow)">
    <rect width="312" height="536" rx="44" fill="url(#phone)" stroke="#5595e7" stroke-width="4"/>
    <rect x="22" y="25" width="268" height="486" rx="28" fill="#f8fbff"/>
    <rect x="111" y="10" width="90" height="17" rx="9" fill="#071429"/>
    <text x="52" y="82" fill="#183253" font-family="Arial, sans-serif" font-size="20" font-weight="700">Recorder</text>
    <circle cx="156" cy="210" r="77" fill="#e7f1ff" stroke="#77aaf0" stroke-width="2"/>
    <circle cx="156" cy="210" r="52" fill="#337fe4"/>
    <rect x="146" y="178" width="20" height="51" rx="10" fill="#fff"/><path d="M132 216c0 34 48 34 48 0M156 250v20M132 270h48" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 334c19-26 35 26 53 0s35 26 53 0 35 26 53 0 35 26 53 0" fill="none" stroke="#337fe4" stroke-width="5" stroke-linecap="round"/>
    <rect x="48" y="389" width="216" height="74" rx="15" fill="#edf5ff"/><text x="68" y="418" fill="#337fe4" font-family="monospace" font-size="13">SYNC STATUS</text><text x="68" y="446" fill="#183253" font-family="Arial, sans-serif" font-size="18" font-weight="700">Audio uploaded</text>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="530" y="116" fill="#2b6ab9" font-family="monospace" font-size="17" letter-spacing="3">ANDROID + CLOUD</text>
    <text x="530" y="170" fill="#102a4d" font-size="40" font-weight="700">Connected recorder workflow</text>
    <g transform="translate(530 222)">
      <rect width="570" height="88" rx="15" fill="#fff" stroke="#9ebfe9"/><circle cx="48" cy="44" r="22" fill="#357fdc"/><text x="48" y="51" text-anchor="middle" fill="#fff" font-size="20">1</text><text x="87" y="39" fill="#173452" font-size="20" font-weight="700">Wi-Fi / FTP synchronization</text><text x="87" y="64" fill="#58708d" font-size="15">Device communication and Opus audio processing</text>
      <path d="M285 88v24" stroke="#5d91d1" stroke-width="3"/><path d="m277 103 8 12 8-12" fill="none" stroke="#5d91d1" stroke-width="3"/>
      <g transform="translate(0 116)"><rect width="570" height="88" rx="15" fill="#fff" stroke="#9ebfe9"/><circle cx="48" cy="44" r="22" fill="#357fdc"/><text x="48" y="51" text-anchor="middle" fill="#fff" font-size="20">2</text><text x="87" y="39" fill="#173452" font-size="20" font-weight="700">Asynchronous transcription</text><text x="87" y="64" fill="#58708d" font-size="15">Cloud Run, Tasks, Storage and Speech-to-Text</text></g>
      <path d="M285 204v24" stroke="#5d91d1" stroke-width="3"/><path d="m277 219 8 12 8-12" fill="none" stroke="#5d91d1" stroke-width="3"/>
      <g transform="translate(0 232)"><rect width="570" height="88" rx="15" fill="#fff" stroke="#9ebfe9"/><circle cx="48" cy="44" r="22" fill="#357fdc"/><text x="48" y="51" text-anchor="middle" fill="#fff" font-size="20">3</text><text x="87" y="39" fill="#173452" font-size="20" font-weight="700">Transcript persistence</text><text x="87" y="64" fill="#58708d" font-size="15">Local recording history backed by Firestore</text></g>
    </g>
  </g>
  <text x="98" y="675" fill="#173452" font-family="Arial, sans-serif" font-size="30" font-weight="700">RISELINK RECORDER PLATFORM</text>
  <text x="1184" y="675" text-anchor="end" fill="#347dcc" font-family="monospace" font-size="16">KOTLIN • JETPACK COMPOSE • GCP</text>
